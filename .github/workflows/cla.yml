# CLA gate. Self-contained GitHub Action — no third-party GitHub App, no OAuth
# install, no external service. Signatures are stored in this repo on the
# `cla-signatures` branch, written with the built-in GITHUB_TOKEN.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signature
        # Runs on PR events, and on the exact comment a contributor posts to sign.
        # Note: pull_request_target never checks out PR head, so untrusted code
        # is not executed with write permissions.
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/phazurlabs/ux-ui-mastery/blob/main/CLA.md
          branch: cla-signatures
          allowlist: phazurlabs,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: |
            Thanks for the contribution. Before this can be merged, we need you to
            sign the [Contributor License Agreement](https://github.com/phazurlabs/ux-ui-mastery/blob/main/CLA.md).

            **You keep full ownership and copyright of your contribution** — the CLA
            is a license grant to Phazur Labs, not an assignment away from you.

            To sign, post exactly this as a new comment on this pull request:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thanks!
