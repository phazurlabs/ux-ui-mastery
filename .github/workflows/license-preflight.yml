# Licensing preflight. Blocks a merge if the repo's license posture regresses:
# missing LICENSE/NOTICE/policy docs, SPDX drift between LICENSE and package
# metadata, or a copyleft dependency that conflicts with Apache-2.0 distribution.
name: License Preflight

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files present
        run: |
          fail=0
          for f in LICENSE NOTICE TRADEMARKS.md CONTRIBUTING.md SECURITY.md CLA.md; do
            if [ -f "$f" ]; then echo "ok   $f"
            else echo "FAIL $f missing"; fail=1; fi
          done
          exit $fail

      - name: LICENSE is unmodified Apache-2.0
        run: |
          head -3 LICENSE | grep -q "Apache License" \
            || { echo "FAIL LICENSE is not Apache-2.0"; exit 1; }
          grep -q "Copyright 2026 Phazur Labs LLC" LICENSE \
            || { echo "FAIL copyright line missing or altered"; exit 1; }
          # The licensed body must stay verbatim or GitHub's licensee gem stops
          # detecting it and downstream compliance scanners miss it. The only
          # permitted edit is the appendix copyright line, so substitute that into
          # upstream and require everything else to match.
          #   -B/-w: apache.org ships a leading blank line and a different trailing
          #   newline than the canonical text, and neither is a real modification.
          curl -fsSL https://www.apache.org/licenses/LICENSE-2.0.txt \
            | sed 's/Copyright \[yyyy\] \[name of copyright owner\]/Copyright 2026 Phazur Labs LLC/' \
            > /tmp/expected.txt
          if ! diff -qBw /tmp/expected.txt LICENSE >/dev/null; then
            echo "FAIL Apache body was modified — breaks license detection"
            diff -Bw /tmp/expected.txt LICENSE | head -20
            exit 1
          fi
          echo "ok   Apache-2.0 body verbatim"

      - name: SPDX identifier matches LICENSE
        run: |
          fail=0
          for meta in package.json .claude-plugin/plugin.json; do
            [ -f "$meta" ] || continue
            got=$(python3 -c "import json;print(json.load(open('$meta')).get('license','<none>'))")
            if [ "$got" = "Apache-2.0" ]; then echo "ok   $meta license=$got"
            else echo "FAIL $meta license=$got, expected Apache-2.0"; fail=1; fi
          done
          # marketplace.json declares a license at the top level and once per
          # plugin entry. A per-entry value drifting to MIT is invisible to the
          # loop above, which is exactly how the 3.0.0 mismatch survived.
          if [ -f .claude-plugin/marketplace.json ]; then
            python3 - <<'PY' || fail=1
import json, sys
d = json.load(open(".claude-plugin/marketplace.json"))
seen = [("(top-level)", d.get("license", "<none>"))]
seen += [(f"[{p.get('name')}]", p.get("license", "<none>")) for p in d.get("plugins", [])]
bad = 0
for where, got in seen:
    if got == "Apache-2.0":
        print(f"ok   marketplace.json {where} license={got}")
    else:
        print(f"FAIL marketplace.json {where} license={got}, expected Apache-2.0")
        bad = 1
sys.exit(bad)
PY
          fi
          exit $fail

      - name: CONTRIBUTING states CLA or DCO
        run: |
          grep -qiE "contributor license agreement|developer certificate of origin" CONTRIBUTING.md \
            && echo "ok   CONTRIBUTING states CLA/DCO" \
            || { echo "FAIL CONTRIBUTING states neither"; exit 1; }

      - name: No copyleft dependencies
        run: |
          [ -f package.json ] || { echo "skip (no package.json)"; exit 0; }
          npm install --package-lock-only --no-audit --no-fund >/dev/null 2>&1 || true
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 \
            || npm install --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 || true
          [ -d node_modules ] || { echo "skip (install unavailable)"; exit 0; }
          hits=$(grep -rhoE '"license"[[:space:]]*:[[:space:]]*"[^"]*(AGPL|SSPL|GPL-2|GPL-3)[^"]*"' \
                   node_modules/*/package.json 2>/dev/null | sort -u || true)
          if [ -n "$hits" ]; then
            echo "FAIL copyleft dependency conflicts with Apache-2.0:"; echo "$hits"; exit 1
          fi
          echo "ok   no GPL/AGPL/SSPL dependencies"

      - name: Plugin structure valid
        # Catches the failure modes that load a broken plugin silently:
        # non-kebab skill names (which become invalid command names),
        # frontmatter outside the Agent Skills spec, and malformed manifest
        # paths. Mirrors `claude plugin validate . --strict`, which is
        # authoritative but needs the Claude Code CLI.
        run: python3 scripts/validate-plugin.py .
