<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 80" width="252" height="80">
  <!-- Sumi wordmark lockup: character + "taste." -->
  <defs>
    <style>
      .wm-body { fill: #E8715A; }
      .wm-shadow { fill: #D4604D; }
      .wm-dark { fill: #1A1A2E; }
      .wm-highlight { fill: #F5C6B8; }
      .wm-glow { fill: #FF8C73; }
    </style>
  </defs>

  <!-- === MINI SUMI (scaled to ~60px tall) === -->
  <g transform="translate(8, 4) scale(0.23)">
    <!-- Pixel crown -->
    <rect class="wm-glow" x="93" y="0" width="14" height="14" rx="1"/>
    <rect class="wm-dark" x="93" y="16" width="14" height="14" rx="1"/>
    <rect class="wm-dark" x="93" y="32" width="14" height="14" rx="1"/>
    <rect class="wm-dark" x="77" y="16" width="14" height="14" rx="1"/>
    <rect class="wm-dark" x="77" y="32" width="14" height="14" rx="1"/>
    <rect class="wm-dark" x="109" y="16" width="14" height="14" rx="1"/>
    <rect class="wm-dark" x="109" y="32" width="14" height="14" rx="1"/>
    <rect class="wm-dark" x="61" y="32" width="14" height="14" rx="1"/>
    <rect class="wm-dark" x="125" y="32" width="14" height="14" rx="1"/>

    <!-- Head -->
    <rect class="wm-body" x="20" y="48" width="160" height="120" rx="32"/>
    <path class="wm-shadow" d="M148,48 h0 a32,32 0 0 1 32,32 v56 a32,32 0 0 1 -32,32 h-40 a100,100 0 0 0 40,-120Z" opacity="0.35"/>

    <!-- Left eye — KAWS X -->
    <g transform="translate(68, 95)">
      <line x1="-14" y1="-14" x2="14" y2="14" stroke="#1A1A2E" stroke-width="5" stroke-linecap="round"/>
      <line x1="14" y1="-14" x2="-14" y2="14" stroke="#1A1A2E" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Right eye — crosshair -->
    <g transform="translate(132, 95)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#1A1A2E" stroke-width="3"/>
      <line x1="-17" y1="0" x2="17" y2="0" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="-17" x2="0" y2="17" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3.5" class="wm-dark"/>
    </g>

    <!-- Cheeks -->
    <ellipse class="wm-highlight" cx="55" cy="125" rx="12" ry="8" opacity="0.6"/>
    <ellipse class="wm-highlight" cx="145" cy="125" rx="12" ry="8" opacity="0.6"/>

    <!-- Mouth -->
    <path d="M88,140 Q100,148 112,140" fill="none" stroke="#1A1A2E" stroke-width="3" stroke-linecap="round"/>

    <!-- Body -->
    <rect class="wm-body" x="50" y="170" width="100" height="55" rx="18"/>

    <!-- Arms -->
    <rect class="wm-body" x="28" y="176" width="20" height="40" rx="10" transform="rotate(-8, 38, 176)"/>
    <rect class="wm-body" x="152" y="176" width="20" height="40" rx="10" transform="rotate(8, 162, 176)"/>

    <!-- Legs -->
    <rect class="wm-body" x="66" y="225" width="26" height="32" rx="12"/>
    <rect class="wm-body" x="108" y="225" width="26" height="32" rx="12"/>
  </g>

  <!-- === DIVIDER === -->
  <line x1="72" y1="18" x2="72" y2="62" stroke="#D4604D" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>

  <!-- === "taste." WORDMARK === -->
  <!-- Clean geometric sans-serif, rendered as paths for portability -->
  <!-- Font size ~40px equivalent, baseline at y=56 -->
  <g fill="#1A1A2E">
    <!-- t -->
    <path d="M88,26 h4 v-8 h6 v8 h7 v5 h-7 v17 q0,4 3,4 h4 v5 h-5 q-8,0 -8,-9 v-17 h-4 Z"/>
    <!-- a -->
    <path d="M115,31 q5,-5 12,-5 q10,0 10,12 v19 h-6 v-4 q-4,5 -10,5 q-9,0 -9,-8 q0,-9 13,-9 h6 v-2 q0,-7 -6,-7 q-5,0 -8,4 Z M121,47 q6,0 10,-5 v-4 h-5 q-8,0 -8,5 q0,4 3,4 Z"/>
    <!-- s -->
    <path d="M146,42 q0,-4 5,-6 q3,-1 7,-1 q6,0 9,3 l-3,4 q-3,-2 -6,-2 q-5,0 -5,3 q0,2 4,3 l5,1 q8,3 8,9 q0,9 -12,9 q-7,0 -11,-4 l3,-4 q4,3 8,3 q6,0 6,-4 q0,-2 -4,-3 l-5,-2 q-9,-3 -9,-9 Z"/>
    <!-- t -->
    <path d="M175,26 h4 v-8 h6 v8 h7 v5 h-7 v17 q0,4 3,4 h4 v5 h-5 q-8,0 -8,-9 v-17 h-4 Z"/>
    <!-- e -->
    <path d="M200,39 q4,-13 16,-13 q12,0 13,15 v2 h-23 q1,9 10,9 q6,0 9,-4 l3,4 q-5,5 -12,5 q-16,0 -16,-18 Z M222,39 q-1,-8 -7,-8 q-7,0 -9,8 Z"/>
    <!-- . (dot) -->
    <circle cx="238" cy="52" r="3.5"/>
  </g>
</svg>