<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">
  <defs>
    <linearGradient id="fire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3D1F"/>
      <stop offset="50%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#FFAA33"/>
    </linearGradient>
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#FFAA33"/>
    </linearGradient>
    <linearGradient id="textFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="180" rx="16" fill="#0A0A0F"/>

  <!-- Flame icon — left of CHEF -->
  <g transform="translate(68, 28)" filter="url(#glow)">
    <path d="M14 52 C14 52, 6 36, 10 24 C12 18, 16 14, 16 8 C16 4, 14 2, 14 0 C18 6, 22 10, 22 14 C22 18, 20 22, 22 26 C26 16, 28 10, 26 4 C30 12, 32 20, 30 28 C34 20, 36 14, 34 6 C38 14, 40 24, 38 34 C36 44, 30 50, 24 52 Z" fill="url(#fire)" opacity="0.9"/>
    <path d="M18 52 C18 52, 14 42, 16 34 C17 30, 20 26, 20 22 C22 26, 24 30, 24 34 C26 28, 28 24, 26 18 C30 24, 32 32, 30 38 C28 46, 24 50, 22 52 Z" fill="#FFCC44" opacity="0.65"/>
  </g>

  <!-- CHEF — small tracked label -->
  <text
    x="260" y="56"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="400"
    font-size="22"
    letter-spacing="12"
    fill="url(#ember)"
  >CHEF</text>

  <!-- SUMI — hero logotype -->
  <text
    x="268" y="112"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="900"
    font-size="72"
    letter-spacing="18"
    fill="url(#textFill)"
  >SUMI</text>

  <!-- Ember rule -->
  <line x1="120" y1="128" x2="400" y2="128" stroke="url(#ember)" stroke-width="1.5" opacity="0.35"/>

  <!-- Descriptor — using Unicode arrow -->
  <text
    x="260" y="152"
    text-anchor="middle"
    font-family="monospace"
    font-weight="400"
    font-size="11"
    letter-spacing="4"
    fill="#555566"
  >SLOP &#x2192; CUISINE</text>

  <!-- Ember dots — plating accent -->
  <circle cx="440" cy="50" r="3" fill="#FF6B4A" opacity="0.5" filter="url(#glow)"/>
  <circle cx="452" cy="44" r="2" fill="#FFAA33" opacity="0.35"/>
  <circle cx="460" cy="50" r="1.2" fill="#FF6B4A" opacity="0.25"/>
</svg>