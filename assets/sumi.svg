<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#FF3D1F"/>
    </linearGradient>
    <linearGradient id="textFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="160" rx="20" fill="#0A0A0F"/>

  <!-- Accent dot — the modern twist -->
  <circle cx="432" cy="108" r="8" fill="url(#accent)" filter="url(#glow)"/>

  <!-- SUMI logotype — geometric, weighted, tracked -->
  <text
    x="240" y="105"
    text-anchor="middle"
    font-family="'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="82"
    letter-spacing="18"
    fill="url(#textFill)"
  >SUMI</text>

  <!-- Thin rule — separates type from descriptor -->
  <line x1="120" y1="122" x2="360" y2="122" stroke="#FF6B4A" stroke-width="1.5" opacity="0.6"/>

  <!-- Descriptor -->
  <text
    x="240" y="142"
    text-anchor="middle"
    font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace"
    font-weight="400"
    font-size="11"
    letter-spacing="5"
    fill="#666677"
  >DESIGN INTELLIGENCE</text>
</svg>